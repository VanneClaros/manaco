<table class="table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
    </tr>

    </thead>
    <tbody>
    @for (item of categorias; track item.id) 
    {
        <tr>
        <td>{{item.id}}</td>
        <td>{{item.nombre}}</td>
        <td>{{item.descripcion}}</td>
        </tr>
    }   
    </tbody>
</table>
